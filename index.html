<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f8" />
    <script>
      // Applied before anything shows, so the page never flashes the wrong colors.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('study-forge-theme'); } catch (e) {}
        var dark = saved === 'dark' || (saved === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        if (saved === 'sun') {
          // Today's sunrise and sunset were saved by the last visit. A day or two old is close enough
          // for this first paint; the exact times are worked out again as soon as the page loads.
          try {
            var sun = JSON.parse(localStorage.getItem('study-forge-theme-sun') || 'null');
            if (sun && sun.always) dark = sun.always === 'dark';
            else if (sun) { var day = 86400000, at = Date.now(), rise = sun.rise + Math.floor((at - sun.rise) / day) * day, length = sun.set - sun.rise; dark = at - rise >= length; }
          } catch (e) {}
        }
        if (saved === 'system' || saved === 'sun') {
          var override = null;
          try { override = localStorage.getItem('study-forge-theme-override'); } catch (e) {}
          if (override === 'dark' || override === 'light') dark = override === 'dark';
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#15181d');
        // Text size, motion and spacing, so a larger text size never jumps in after loading.
        var pick = function (key, allowed, fallback) {
          var value = null;
          try { value = localStorage.getItem(key); } catch (e) {}
          return allowed.indexOf(value) >= 0 ? value : fallback;
        };
        var root = document.documentElement.dataset;
        root.text = pick('study-forge-text', ['standard', 'large', 'larger'], 'standard');
        root.motion = pick('study-forge-motion', ['device', 'reduce'], 'device');
        root.density = pick('study-forge-density', ['comfortable', 'compact'], 'comfortable');
      })();
    </script>
    <meta name="description" content="Keep your courses and study files in one place." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23162130'/><rect x='6' y='8' width='6' height='18' fill='%237DD3FC'/><rect x='14' y='5' width='5' height='21' fill='%236EE7C8'/><rect x='21' y='11' width='5' height='15' fill='%23B4A7F5'/></svg>" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Study Forge" />
    <title>Study Forge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
