# Builds the site and publishes it to GitHub Pages whenever main changes.
name: Publish site

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nothing is published unless every browser test passes.
  test:
    runs-on: ubuntu-latest
    # A full run takes a few minutes. This is a backstop, not an estimate.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The package servers sometimes stop answering and apt waits forever, which once held a
      # publish for over 40 minutes before a single test ran. Each try is capped, and a few
      # tries are made before giving up.
      - name: Install ffmpeg
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg; then
              exit 0
            fi
            echo "ffmpeg install attempt $attempt didn't finish; trying again"
            sleep 10
          done
          exit 1
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      # The search tests build small image and scanned-PDF fixtures with these.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet Pillow img2pdf
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Tests the real privacy rules and sync code against Google's emulators.
      - run: npx -y firebase-tools@15.34.2 emulators:exec --only auth,firestore --project demo-study-forge "node --test --test-reporter=spec tests/firebase.test.mjs"
  # Only main is published. Other branches just run the tests.
  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
